<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragonLock - Monad Liquidity Locker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/web3/4.3.0/web3.min.js"></script>
    <style>
        :root {
            --primary: #00ffb3;
            --primary-dark: #0f172a;
            --secondary: #6366f1;
            --accent: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --glass: rgba(0, 255, 179, 0.08);
            --glass-border: rgba(0, 255, 179, 0.18);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0f172a 100%);
            min-height: 100vh;
            color: #e0ffe0;
            position: relative;
            overflow-x: hidden;
        }
        .container {
            max-width: 1500px;
            margin: 40px auto 0 auto;
            padding: 40px 24px;
            position: relative;
            z-index: 1;
        }
        .glass {
            background: var(--glass);
            border: 2px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0,255,179,0.10), 0 1.5px 8px #00ffb3a0;
            border-radius: 28px;
            margin-bottom: 32px;
            margin-top: 32px;
            padding: 32px 32px 24px 32px;
        }
        .header {
            text-align: center;
            padding: 40px 20px 30px 20px;
            margin-bottom: 40px;
        }
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .logo-img {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            box-shadow: 0 0 40px 10px #00ffb3a0, 0 0 0 8px #0f172a;
            background: #0f172a;
            object-fit: cover;
            margin-bottom: 20px;
            border: 2px solid #00ffb3;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .header h1 {
            font-size: 3.5em;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffb3, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: -2px;
        }
        .header p {
            font-size: 1.3em;
            color: #baffd9;
            font-weight: 400;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .stat-card {
            padding: 30px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
            background: rgba(0,255,179,0.10);
            border-radius: 20px;
            border: 1.5px solid #00ffb3;
            box-shadow: 0 4px 16px #00ffb3a0;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-icon { font-size: 2.5em; margin-bottom: 15px; display: block; }
        .stat-value {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00ffb3, #fff, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-label {
            color: #baffd9;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .connect-section {
            padding: 30px;
            margin-bottom: 40px;
            text-align: center;
        }
        .connect-btn {
            background: linear-gradient(135deg, #00ffb3, #6366f1);
            color: #0f172a;
            border: none;
            padding: 18px 60px;
            border-radius: 16px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px #00ffb3a0;
            position: relative;
            overflow: hidden;
        }
        .connect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px #00ffb3a0;
        }
        .connect-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .wallet-info {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0,255,179,0.10);
            border-radius: 16px;
            display: none;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .wallet-address {
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            font-size: 1.1em;
            color: #00ffb3;
            font-weight: 700;
        }
        .locks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 30px;
        }
        .lock-card {
            padding: 35px;
            position: relative;
            transition: all 0.3s ease;
            background: rgba(0,255,179,0.10);
            border-radius: 20px;
            border: 1.5px solid #00ffb3;
            box-shadow: 0 4px 16px #00ffb3a0;
        }
        .lock-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px #00ffb3a0;
        }
        .lock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .lock-id {
            background: linear-gradient(135deg, #00ffb3, #6366f1);
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95em;
            letter-spacing: 0.5px;
            color: #0f172a;
        }
        .lock-status {
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 0.9em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-locked {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
        }
        .status-unlocked {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
        }
        .status-withdrawn {
            background: linear-gradient(135deg, #6b7280, #4b5563);
            color: #fff;
        }
        /* Digital Timer */
        .timer-section {
            background: linear-gradient(135deg, rgba(0,255,179,0.10), rgba(99,102,241,0.10));
            padding: 30px;
            border-radius: 20px;
            margin: 25px 0;
            border: 1.5px solid #00ffb3;
        }
        .timer-title {
            font-size: 1.1em;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            color: #baffd9;
        }
        .timer-display {
            display: flex;
            justify-content: center;
            gap: 18px;
            background: rgba(0, 255, 128, 0.08);
            border-radius: 16px;
            padding: 18px 0;
            margin: 0 10px;
            box-shadow: 0 0 16px #00ffb3a0;
        }
        .timer-unit {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00ffb3;
            border-radius: 10px;
            padding: 12px 18px;
            min-width: 60px;
            text-align: center;
            box-shadow: 0 0 8px #00ffb3a0;
        }
        .timer-value {
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            font-size: 2.8em;
            color: #00ffb3;
            text-shadow: 0 0 8px #00ffb3, 0 0 2px #fff;
            letter-spacing: 2px;
        }
        .timer-label {
            font-size: 0.8em;
            color: #baffd9;
            margin-top: 4px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .progress-container {
            margin: 25px 0;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #baffd9;
        }
        .progress-bar {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            height: 12px;
            overflow: hidden;
            position: relative;
            border: 1px solid #00ffb3;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffb3, #6366f1);
            border-radius: 12px;
            transition: width 1s ease;
            position: relative;
            overflow: hidden;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .lock-details {
            background: rgba(0, 0, 0, 0.2);
            padding: 25px;
            border-radius: 16px;
            margin-top: 25px;
            border: 1px solid #00ffb3;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #00ffb3a0;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label {
            color: #baffd9;
            font-weight: 500;
            font-size: 0.95em;
        }
        .detail-value {
            color: #fff;
            font-weight: 700;
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            font-size: 0.9em;
        }
        .action-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .withdraw-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 10px 30px #10b98150;
        }
        .withdraw-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px #10b98180;
        }
        .withdraw-btn:disabled {
            background: linear-gradient(135deg, #4b5563, #374151);
            cursor: not-allowed;
            box-shadow: none;
        }
        .loading, .empty-state {
            padding: 80px 40px;
            text-align: center;
        }
        .loading {
            font-size: 1.5em;
            color: #baffd9;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #00ffb320;
            border-top-color: #00ffb3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state {
            background: rgba(0,255,179,0.04);
            border-radius: 24px;
            border: 2px dashed #00ffb3a0;
        }
        .empty-icon {
            font-size: 5em;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .empty-state h3 {
            font-size: 2em;
            margin-bottom: 15px;
            color: #baffd9;
        }
        .empty-state p {
            color: #baffd9;
            font-size: 1.1em;
            line-height: 1.6;
        }
        .footer {
            padding: 40px;
            margin-top: 60px;
            text-align: center;
            border-top: 1px solid #00ffb3a0;
        }
        .footer-brand {
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00ffb3, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .footer-links {
            color: #baffd9;
            margin: 10px 0;
        }
        .footer-links a {
            color: #00ffb3;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }
        .footer-links a:hover { color: #6366f1; }
        .error-message {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            padding: 20px 30px;
            border-radius: 16px;
            margin: 20px 0;
            display: none;
            animation: slideIn 0.3s ease;
        }
        @media (max-width: 900px) {
            .locks-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 2.2em; }
            .logo-img { width: 80px; height: 80px; }
        }
        @media (max-width: 600px) {
            .container { padding: 10px; }
            .glass { padding: 16px 8px; }
            .stat-card, .lock-card { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header glass">
            <div class="logo-container">
                <img src="https://files.catbox.moe/rmyzcq.png" alt="DragonLock Logo" class="logo-img" />
            </div>
            <h1>DragonLock</h1>
            <p>Secure Liquidity Locker for Monad Blockchain</p>
            <div class="stats-grid">
                <div class="stat-card glass">
                    <span class="stat-icon">📦</span>
                    <div class="stat-value" id="totalLocks">0</div>
                    <div class="stat-label">Total Locks</div>
                </div>
                <div class="stat-card glass">
                    <span class="stat-icon">⏱️</span>
                    <div class="stat-value">180</div>
                    <div class="stat-label">Days Lock Period</div>
                </div>
                <div class="stat-card glass">
                    <span class="stat-icon">💎</span>
                    <div class="stat-value">0.01</div>
                    <div class="stat-label">MON Lock Fee</div>
                </div>
            </div>
        </header>
        <section class="connect-section glass">
            <button id="connectBtn" class="connect-btn">
                🔗 Connect Wallet
            </button>
            <div id="walletInfo" class="wallet-info">
                <strong>Connected:</strong> 
                <span class="wallet-address" id="walletAddress"></span>
            </div>
        </section>
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <div>Loading your locks...</div>
        </div>
        <div id="error" class="error-message"></div>
        <div id="locksContainer" class="locks-grid"></div>
        <footer class="footer">
            <div class="footer-brand">DragonLock</div>
            <div class="footer-links">
                Built by the DRAGON Team 🚀
            </div>
            <div class="footer-links">
                Contract: <a href="https://explorer.monad.xyz/address/0x866a16c42F6B0016E048aCd696662bE2E7d31F5F" target="_blank">
                    0x866a16c42F6B0016E048aCd696662bE2E7d31F5F
                </a>
            </div>
            <div class="footer-links" style="margin-top: 15px;">
                Powered by Monad 💜
            </div>
        </footer>
    </div>
    <script>
        const LOCKER_ADDRESS = '0x866a16c42F6B0016E048aCd696662bE2E7d31F5F';
        const LOCKER_ABI = [{"inputs":[{"name":"user","type":"address"}],"name":"getUserLocks","outputs":[{"name":"","type":"uint256[]"}],"stateMutability":"view","type":"function"},{"inputs":[{"name":"lockId","type":"uint256"}],"name":"getLock","outputs":[{"components":[{"name":"id","type":"uint256"},{"name":"token","type":"address"},{"name":"owner","type":"address"},{"name":"amount","type":"uint256"},{"name":"lockDate","type":"uint256"},{"name":"unlockDate","type":"uint256"},{"name":"withdrawn","type":"bool"},{"name":"description","type":"string"}],"name":"","type":"tuple"}],"stateMutability":"view","type":"function"},{"inputs":[{"name":"lockId","type":"uint256"}],"name":"getCountdownTimer","outputs":[{"name":"daysRemaining","type":"uint256"},{"name":"hoursRemaining","type":"uint256"},{"name":"minutesRemaining","type":"uint256"},{"name":"secondsRemaining","type":"uint256"},{"name":"totalSeconds","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"name":"lockId","type":"uint256"}],"name":"getLockProgress","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"name":"lockId","type":"uint256"}],"name":"withdrawTokens","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"lockCounter","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"}];

        let web3;
        let contract;
        let userAddress;
        let timers = {};

        document.getElementById('connectBtn').addEventListener('click', async () => {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    userAddress = accounts[0];
                    
                    web3 = new Web3(window.ethereum);
                    contract = new web3.eth.Contract(LOCKER_ABI, LOCKER_ADDRESS);
                    
                    document.getElementById('walletAddress').textContent = 
                        userAddress.substring(0, 6) + '...' + userAddress.substring(38);
                    document.getElementById('walletInfo').style.display = 'block';
                    document.getElementById('connectBtn').textContent = '✓ Wallet Connected';
                    document.getElementById('connectBtn').disabled = true;
                    
                    await loadStats();
                    await loadLocks();
                } catch (error) {
                    showError('Failed to connect wallet: ' + error.message);
                }
            } else {
                showError('Please install MetaMask to use this dApp');
            }
        });

        async function loadStats() {
            try {
                const totalLocks = await contract.methods.lockCounter().call();
                document.getElementById('totalLocks').textContent = totalLocks;
            } catch (error) {
                console.error('Stats error:', error);
            }
        }

        async function loadLocks() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('locksContainer').innerHTML = '';
            
            try {
                const lockIds = await contract.methods.getUserLocks(userAddress).call();
                
                if (lockIds.length === 0) {
                    document.getElementById('locksContainer').innerHTML = `
                        <div class="empty-state glass" style="grid-column: 1/-1;">
                            <div class="empty-icon">🔒</div>
                            <h3>No Locks Found</h3>
                            <p>You haven't locked any tokens yet.</p>
                            <p style="margin-top: 10px;">Lock your LP tokens to build trust with your community!</p>
                        </div>
                    `;
                } else {
                    for (const lockId of lockIds) {
                        await displayLock(lockId);
                    }
                }
            } catch (error) {
                showError('Failed to load locks: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function displayLock(lockId) {
            try {
                const lock = await contract.methods.getLock(lockId).call();
                const progress = await contract.methods.getLockProgress(lockId).call();
                
                const card = document.createElement('div');
                card.className = 'lock-card glass';
                card.id = `lock-${lockId}`;
                
                const status = lock.withdrawn ? 'withdrawn' : 
                              (Date.now() / 1000 >= lock.unlockDate ? 'unlocked' : 'locked');
                
                card.innerHTML = `
                    <div class="lock-header">
                        <div class="lock-id">Lock #${lockId}</div>
                        <div class="lock-status status-${status}">
                            ${status === 'locked' ? '🔒 Locked' : status === 'unlocked' ? '🔓 Unlocked' : '✓ Withdrawn'}
                        </div>
                    </div>
                    
                    <div class="timer-section">
                        <div class="timer-title">
                            ${status === 'locked' ? '⏰ Time Remaining' : status === 'unlocked' ? '✅ Ready to Withdraw' : '✓ Already Withdrawn'}
                        </div>
                        <div class="timer-display" id="timer-display-${lockId}"></div>
                    </div>
                    
                    <div class="progress-container">
                        <div class="progress-label">
                            <span>Progress</span>
                            <span><strong>${progress}%</strong></span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                    </div>
                    
                    <div class="lock-details">
                        <div class="detail-row">
                            <span class="detail-label">💰 Token</span>
                            <span class="detail-value">${lock.token.substring(0, 10)}...${lock.token.substring(38)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">📊 Amount</span>
                            <span class="detail-value">${formatAmount(lock.amount)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">🔒 Locked On</span>
                            <span class="detail-value">${formatDate(lock.lockDate)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">🔓 Unlocks On</span>
                            <span class="detail-value">${formatDate(lock.unlockDate)}</span>
                        </div>
                        ${lock.description ? `
                        <div class="detail-row">
                            <span class="detail-label">📝 Description</span>
                            <span class="detail-value">${lock.description}</span>
                        </div>
                        ` : ''}
                    </div>
                    
                    ${!lock.withdrawn && status === 'unlocked' ? `
                        <button class="action-btn withdraw-btn" onclick="withdrawLock(${lockId})">
                            💰 Withdraw Tokens
                        </button>
                    ` : lock.withdrawn ? `
                        <button class="action-btn withdraw-btn" disabled>
                            ✓ Tokens Withdrawn
                        </button>
                    ` : ''}
                `;
                
                document.getElementById('locksContainer').appendChild(card);
                
                if (status === 'locked') {
                    startTimer(lockId);
                }
            } catch (error) {
                console.error('Error displaying lock:', error);
            }
        }

        async function startTimer(lockId) {
            async function updateTimer() {
                try {
                    const timer = await contract.methods.getCountdownTimer(lockId).call();
                    const display = document.getElementById(`timer-display-${lockId}`);
                    
                    if (!display) return;
                    
                    if (timer.totalSeconds == 0) {
                        display.innerHTML = `
                            <div style="grid-column: 1/-1; padding: 20px; text-align: center;">
                                <div style="font-size: 2em; margin-bottom: 10px;">🎉</div>
                                <div style="font-size: 1.2em; font-weight: 600;">Lock Expired!</div>
                                <div style="font-size: 0.9em; opacity: 0.7; margin-top: 5px;">You can withdraw now</div>
                            </div>
                        `;
                        clearInterval(timers[lockId]);
                        return;
                    }
                    
                    display.innerHTML = `
                        <div class="timer-unit">
                            <span class="timer-value">${timer.daysRemaining}</span>
                            <span class="timer-label">Days</span>
                        </div>
                        <div class="timer-unit">
                            <span class="timer-value">${timer.hoursRemaining}</span>
                            <span class="timer-label">Hours</span>
                        </div>
                        <div class="timer-unit">
                            <span class="timer-value">${timer.minutesRemaining}</span>
                            <span class="timer-label">Minutes</span>
                        </div>
                        <div class="timer-unit">
                            <span class="timer-value">${timer.secondsRemaining}</span>
                            <span class="timer-label">Seconds</span>
                        </div>
                    `;
                } catch (error) {
                    // ignore
                }
            }
            await updateTimer();
            timers[lockId] = setInterval(updateTimer, 1000);
        }

        async function withdrawLock(lockId) {
            try {
                document.getElementById(`lock-${lockId}`).querySelector('.withdraw-btn').disabled = true;
                await contract.methods.withdrawTokens(lockId).send({ from: userAddress });
                await loadLocks();
            } catch (error) {
                showError('Withdraw failed: ' + (error.message || error));
                document.getElementById(`lock-${lockId}`).querySelector('.withdraw-btn').disabled = false;
            }
        }

        function formatAmount(amount) {
            if (!amount) return '0';
            // Show up to 4 decimals, remove trailing zeros
            return (parseFloat(web3.utils.fromWei(amount, 'ether')).toLocaleString(undefined, { maximumFractionDigits: 4 }));
        }
        function formatDate(ts) {
            if (!ts) return '-';
            const d = new Date(ts * 1000);
            return d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
        }
        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 6000);
        }
    </script>
</body>
</html>
